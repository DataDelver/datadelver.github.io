name: newsletter-email

on:
  push:
    branches:
      - main
    paths:
      - "docs/posts/**/*.md"
  # Manual trigger for regenerating a draft (e.g. after a formatting fix).
  # Provide the commit range explicitly, since github.event.before is only
  # available for push events.
  workflow_dispatch:
    inputs:
      sha_prev:
        description: "Previous commit SHA to diff against (default: HEAD~1)"
        required: false
        default: ""
      sha_curr:
        description: "Current commit SHA (default: HEAD)"
        required: false
        default: ""

# Avoid concurrent runs on rapid pushes
concurrency:
  group: newsletter-email
  cancel-in-progress: true

jobs:
  create-draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history for git diff

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Create draft newsletter email
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: |
          # For pushes, ${{ github.event.before }} is the SHA of the tip of
          # the previous ref. This correctly handles multi-commit pushes by
          # comparing against the state before this push started.
          # For manual dispatches, fall back to the provided inputs (or the
          # script's own HEAD~1..HEAD defaults when left empty).
          prev="${{ github.event.before || github.event.inputs.sha_prev }}"
          curr="${{ github.event.inputs.sha_curr || 'HEAD' }}"
          python scripts/newsletter_email.py \
            --sha-prev "$prev" \
            --sha-curr "$curr"
